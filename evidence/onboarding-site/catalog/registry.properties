model.harriet_qwen3_5_4b_decisions.description=A Jev-style System One that runs on your own machine: the same three typed answers a System One API returns - Noul (a proposition and the probability it holds), Choice (one of N labels) and Score (an ordinal rating) - over exactly the options you declare, in one pass however many there are. The answer is a typed value, not prose, so there is nothing to parse or repair and no decoding loop to time out. No API key, no per-token cost, nothing leaves the machine. Frozen Qwen3.5-4B, Apache-2.0, unmodified.
